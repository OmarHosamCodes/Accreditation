<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Accreditation — Social Media Audit Bureau</title>
<meta name="description" content="An independent accreditation for FB & IG brand presences. Audited across 16 dimensions. Earn your tier." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b0d; --bg2:#101216; --surf:rgba(255,255,255,.04); --surf2:rgba(255,255,255,.06);
  --glass:rgba(20,22,27,.72); --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --txt:#f2f3f5; --txt2:#a4a8b2; --txt3:#6b6f7a;
  --acc:#c6ff3d; --acc-d:#aef000; --acc-soft:rgba(198,255,61,.13); --cyan:#5ff0e0;
  --plat:#7cc4ff; --gld:#f0c659; --slv:#c9cdd6; --brz:#e09a5f; --roast:#ff6a55;
  --r:14px; --r-lg:20px; --r-sm:10px;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);
  --sh-sm:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Geist',system-ui,sans-serif; font-size:15.5px; line-height:1.6;
  font-weight:400; letter-spacing:-.011em; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 600px at 82% -8%, rgba(198,255,61,.10), transparent 60%),
    radial-gradient(800px 700px at 8% 4%, rgba(95,240,224,.07), transparent 55%);
  background-attachment:fixed; min-height:100vh;
}
h1,h2,h3,h4{font-weight:600; line-height:1.05; letter-spacing:-.03em}
.serif{font-family:'Instrument Serif',Georgia,serif; font-weight:400; letter-spacing:-.01em}
.mono{font-family:'Geist Mono',monospace; letter-spacing:-.02em}
button{font-family:inherit; cursor:pointer; color:inherit}
a{color:inherit; text-decoration:none}
::selection{background:var(--acc-soft); color:var(--acc)}
.wrap{max-width:1080px; margin:0 auto; padding:0 24px}
.hidden{display:none !important}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
section>.wrap>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}

/* nav */
header.nav{position:sticky; top:0; z-index:50; background:rgba(10,11,13,.6); backdrop-filter:blur(18px) saturate(160%); border-bottom:1px solid var(--line)}
.nav-in{display:flex; align-items:center; justify-content:space-between; height:62px}
.brand{display:flex; align-items:center; gap:10px; font-size:16px; font-weight:600; letter-spacing:-.02em; cursor:pointer}
.brand .seal{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:var(--acc);color:#0a0b0d;box-shadow:0 0 0 1px rgba(198,255,61,.4),0 4px 16px rgba(198,255,61,.25)}
.navlinks{display:flex; gap:2px; align-items:center}
.navlinks a{font-weight:500; font-size:13.5px; color:var(--txt2); padding:8px 13px; border-radius:9px; transition:.18s}
.navlinks a:hover{color:var(--txt); background:var(--surf)}
.navlinks a.cta{background:var(--acc); color:#0a0b0d; font-weight:600; margin-left:6px}
.navlinks a.cta:hover{background:var(--acc-d); box-shadow:0 4px 18px rgba(198,255,61,.3)}
@media(max-width:760px){ .navlinks a:not(.cta):not(.adminlink){display:none} }

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px;padding:11px 18px;border:1px solid var(--line2);background:var(--surf);color:var(--txt);border-radius:11px;transition:.18s cubic-bezier(.2,.7,.2,1);backdrop-filter:blur(8px)}
.btn:hover{background:var(--surf2);border-color:var(--line2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.solid{background:var(--txt);color:var(--bg);border-color:transparent}
.btn.acc{background:var(--acc);color:#0a0b0d;border-color:transparent;font-weight:600}
.btn.acc:hover{background:var(--acc-d);box-shadow:0 6px 22px rgba(198,255,61,.32)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surf);border-color:transparent}
.btn i{font-style:normal}

/* hero */
.hero{padding:84px 0 64px; border-bottom:1px solid var(--line)}
.kicker{font-family:'Geist Mono',monospace; font-size:11px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--acc); display:inline-flex; align-items:center; gap:8px; background:var(--acc-soft); border:1px solid rgba(198,255,61,.22); padding:6px 13px; border-radius:30px; margin-bottom:26px}
.hero h1{font-size:clamp(40px,7.5vw,78px); font-weight:600; letter-spacing:-.04em; max-width:15ch; line-height:1.0}
.hero h1 em{font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; color:var(--acc); letter-spacing:-.01em}
.hero p.lede{font-size:18px; max-width:56ch; margin:26px 0 32px; color:var(--txt2); font-weight:400}
.herorow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.statline{display:flex; gap:48px; margin-top:56px; flex-wrap:wrap}
.statline .s b{font-size:36px;font-weight:600;letter-spacing:-.03em;display:block;line-height:1}
.statline .s span{font-size:12px;font-weight:500;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;display:block}

/* sections */
section{padding:64px 0}
.sec-h{font-size:12px;font-family:'Geist Mono',monospace;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:12px}
h2.big{font-size:clamp(28px,4.4vw,42px);font-weight:600;letter-spacing:-.035em;margin-bottom:8px}

/* tier strip */
.tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tier{padding:22px 16px;text-align:center;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);transition:.2s;backdrop-filter:blur(8px)}
.tier:hover{border-color:var(--line2);background:var(--surf2);transform:translateY(-3px)}
.tier .dot{width:42px;height:42px;border-radius:13px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#0a0b0d}
.tier h4{font-size:15px;font-weight:600;margin-bottom:2px}
.tier p{font-size:12px;color:var(--txt3);font-weight:500;font-family:'Geist Mono',monospace}
@media(max-width:680px){.tiers{grid-template-columns:repeat(2,1fr)}}

/* dimension grid */
.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:14px}
.catcard{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surf);padding:22px;transition:.2s;backdrop-filter:blur(8px)}
.catcard:hover{border-color:var(--line2);background:var(--surf2);transform:translateY(-3px)}
.catcard .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.catcard h3{font-size:18px;font-weight:600}
.wpill{font-family:'Geist Mono',monospace;font-size:11px;font-weight:500;background:var(--acc-soft);color:var(--acc);padding:4px 9px;border-radius:20px;border:1px solid rgba(198,255,61,.2)}
.catcard ul{list-style:none}
.catcard li{font-size:13.5px;font-weight:400;color:var(--txt2);padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center}
.catcard li:last-child{border-bottom:none}
.catcard li i{color:var(--acc);font-style:normal;font-size:11px}

/* leaderboard table */
.lbcontrols{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.lbcontrols select,.lbcontrols input{font-family:inherit;font-size:14px;font-weight:400;padding:10px 14px;border:1px solid var(--line2);border-radius:11px;background:var(--surf);color:var(--txt);transition:.18s}
.lbcontrols select:focus,.lbcontrols input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.lbcontrols input::placeholder{color:var(--txt3)}
table.lb{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surf);backdrop-filter:blur(8px)}
table.lb th{font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:14px 16px;color:var(--txt3);cursor:pointer;white-space:nowrap;font-weight:500;border-bottom:1px solid var(--line);transition:.15s}
table.lb th:hover{color:var(--acc)}
table.lb td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:400;color:var(--txt2)}
table.lb tr:last-child td{border-bottom:none}
table.lb tbody tr{cursor:pointer;transition:.13s}
table.lb tbody tr:hover{background:var(--surf2)}
table.lb tbody tr:hover td{color:var(--txt)}
.rank{font-weight:600;font-size:15px;color:var(--txt)!important;font-family:'Geist Mono',monospace}
.scorecell{font-family:'Geist Mono',monospace;font-weight:500;color:var(--txt)!important;font-size:15px}
.tierbadge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;padding:5px 11px;border-radius:30px;border:1px solid var(--line2);white-space:nowrap;background:var(--surf)}
.tierbadge .tdot{width:8px;height:8px;border-radius:50%}
.plat{color:var(--plat)} .gld{color:var(--gld)} .slv{color:var(--slv)} .brz{color:var(--brz)} .roast{color:var(--roast)}
.platd{background:var(--plat)} .gldd{background:var(--gld)} .slvd{background:var(--slv)} .brzd{background:var(--brz)} .roastd{background:var(--roast)}
.plat .tdot{background:var(--plat)}.gld .tdot{background:var(--gld)}.slv .tdot{background:var(--slv)}.brz .tdot{background:var(--brz)}.roast .tdot{background:var(--roast)}
.pf{font-family:'Geist Mono',monospace;font-size:10.5px;font-weight:500;border:1px solid var(--line2);padding:3px 8px;border-radius:7px;color:var(--txt2)}

/* audit page */
.auditgrid{display:grid;grid-template-columns:320px 1fr;gap:32px}
@media(max-width:780px){.auditgrid{grid-template-columns:1fr}}
.scorebox{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--glass);backdrop-filter:blur(20px);overflow:hidden;position:sticky;top:80px;box-shadow:var(--sh)}
.scorebox .top{padding:32px 24px;text-align:center;border-bottom:1px solid var(--line);position:relative}
.scorebox .top::after{content:'';position:absolute;inset:0;opacity:.16;background:radial-gradient(circle at 50% 40%,currentColor,transparent 70%);pointer-events:none}
.scorebox .bignum{font-size:76px;line-height:.9;font-weight:600;letter-spacing:-.04em}
.scorebox .of{font-size:11px;font-weight:500;font-family:'Geist Mono',monospace;letter-spacing:.1em;color:var(--txt2);margin-top:6px}
.scorebox .bod{padding:20px 22px}
.scorebox .meta{font-size:13px;color:var(--txt3);font-weight:400;display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.scorebox .meta b,.scorebox .meta span:last-child{color:var(--txt);font-weight:500}
.scorebox .meta:last-of-type{border-bottom:none}
.catblock{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surf);margin-bottom:16px;overflow:hidden;backdrop-filter:blur(8px)}
.catblock .cbh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.catblock .cbh h3{font-size:16px;font-weight:600}
.catblock .cbh .cbs{font-family:'Geist Mono',monospace;font-weight:500;font-size:15px;color:var(--acc)}
.dimrow{padding:15px 20px;border-bottom:1px solid var(--line)}
.dimrow:last-child{border-bottom:none}
.dimtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dimtop .dn{font-weight:500;font-size:14px}
.dimtop .ds{font-family:'Geist Mono',monospace;font-weight:500;font-size:13px;color:var(--txt2)}
.bar{height:6px;background:var(--surf2);border-radius:20px;margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--acc));border-radius:20px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.dimnote{font-size:13px;color:var(--txt3);margin-top:8px;font-family:'Instrument Serif',serif;font-size:15px}

/* embed box */
.embed{border:1px dashed var(--line2);border-radius:var(--r);background:var(--bg2);padding:16px;margin-top:18px}
.embed code{font-family:'Geist Mono',monospace;font-size:11px;display:block;white-space:pre-wrap;word-break:break-all;color:var(--txt3);margin-top:10px;line-height:1.6}

/* forms */
.form{max-width:640px}
.field{margin-bottom:18px}
.field label{display:block;font-weight:500;font-size:12px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt2)}
.field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--line2);border-radius:11px;background:var(--surf);color:var(--txt);transition:.18s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.field input::placeholder,.field textarea::placeholder{color:var(--txt3)}
.field textarea{resize:vertical;min-height:96px}
.field .hint{font-size:12.5px;color:var(--txt3);margin-top:6px}
.hp{position:absolute;left:-9999px}
.notice{padding:14px 16px;border:1px solid var(--line2);border-radius:var(--r);font-weight:400;font-size:14px;margin-bottom:18px;display:flex;gap:10px;align-items:center;background:var(--surf)}
.notice.ok{border-color:rgba(95,240,224,.3);background:rgba(95,240,224,.08);color:var(--cyan)}
.notice.err{border-color:rgba(255,106,85,.3);background:rgba(255,106,85,.08);color:var(--roast)}

/* method */
.methrow{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);margin-bottom:12px;overflow:hidden;transition:.2s;backdrop-filter:blur(8px)}
.methrow:hover{border-color:var(--line2)}
.methrow summary{padding:18px 22px;font-weight:500;font-size:15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;list-style:none;gap:14px}
.methrow summary::-webkit-details-marker{display:none}
.methrow summary .qmeta{color:var(--txt3);font-weight:400}
.methrow summary .cat{font-family:'Geist Mono',monospace;font-size:10.5px;font-weight:500;background:var(--surf2);padding:4px 9px;border-radius:20px;color:var(--txt3);white-space:nowrap}
.methrow[open]{background:var(--surf2)}
.methrow[open] summary{border-bottom:1px solid var(--line)}
.anchors{padding:20px 22px}
.anchors .ar{display:grid;grid-template-columns:70px 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.anchors .ar:last-child{border-bottom:none}
.anchors .al{font-family:'Geist Mono',monospace;font-weight:500;font-size:12px;color:var(--acc)}
.anchors .av{font-size:14px;color:var(--txt2)}

/* footer */
footer{border-top:1px solid var(--line);padding:44px 0;margin-top:48px}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;align-items:center}
.foot .small{font-size:13px;color:var(--txt3);font-weight:400;max-width:44ch}

/* ===== ADMIN ===== */
.admin-wrap{display:flex;min-height:100vh}
.adminbar{width:236px;background:rgba(14,16,20,.7);backdrop-filter:blur(20px);border-right:1px solid var(--line);padding:24px 16px;flex-shrink:0}
.adminbar .ab-brand{font-size:16px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:9px}
.adminbar .ab-brand .seal{width:26px;height:26px;border-radius:8px;background:var(--acc);color:#0a0b0d;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.adminbar .ab-sub{font-size:10px;font-family:'Geist Mono',monospace;color:var(--txt3);margin-bottom:28px;letter-spacing:.08em;padding-left:35px}
.adminbar .navi{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:none;color:var(--txt2);font-weight:500;font-size:14px;padding:11px 13px;border-radius:11px;margin-bottom:2px;transition:.15s}
.adminbar .navi:hover{background:var(--surf);color:var(--txt)}
.adminbar .navi.on{background:var(--acc-soft);color:var(--acc)}
.adminbar .navi i{font-size:18px;width:20px;text-align:center}
.adminbar .who{position:absolute;bottom:20px;font-size:12px;color:var(--txt3)}
.admin-main{flex:1;padding:32px 36px;overflow:auto}
@media(max-width:760px){.adminbar{width:62px;padding:18px 8px}.adminbar .ab-brand span:not(.seal),.adminbar .ab-sub,.adminbar .navi span,.adminbar .who{display:none}.adminbar .navi{justify-content:center}.admin-main{padding:20px}}
.ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.ah h2{font-size:28px;font-weight:600;letter-spacing:-.03em}
.card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surf);padding:20px 22px;margin-bottom:16px;backdrop-filter:blur(8px)}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.qrow:last-child{border-bottom:none}
.qmeta{font-size:12.5px;color:var(--txt3);font-weight:400}
.stag{font-family:'Geist Mono',monospace;font-size:10px;font-weight:500;padding:4px 9px;border-radius:20px;border:1px solid var(--line2);text-transform:uppercase;letter-spacing:.04em;color:var(--txt2)}
.s-pending{color:var(--gld);border-color:rgba(240,198,89,.3)} .s-in_progress{color:var(--plat);border-color:rgba(124,196,255,.3)} .s-rejected{color:var(--roast);border-color:rgba(255,106,85,.3)} .s-completed{color:var(--cyan);border-color:rgba(95,240,224,.3)} .s-new{color:var(--txt2)} .s-reaudit{color:var(--brz);border-color:rgba(224,154,95,.3)}
/* editor */
.ed-dim{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;background:var(--surf);transition:.18s}
.ed-dim:hover{border-color:var(--line2)}
.ed-dim .edt{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ed-dim .edt .ednm{font-weight:500;font-size:15px}
.ed-dim .edt .edsc{font-family:'Geist Mono',monospace;font-weight:500;font-size:22px;min-width:34px;text-align:right;color:var(--acc)}
.ed-dim input[type=range]{width:100%;margin:14px 0 8px;-webkit-appearance:none;appearance:none;height:6px;border-radius:20px;background:var(--surf2);outline:none}
.ed-dim input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--acc);cursor:pointer;box-shadow:0 0 0 4px var(--acc-soft),0 2px 8px rgba(0,0,0,.4);transition:.12s}
.ed-dim input[type=range]::-webkit-slider-thumb:hover{box-shadow:0 0 0 6px var(--acc-soft),0 2px 10px rgba(0,0,0,.5)}
.ed-dim input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:var(--acc);cursor:pointer}
.anchortxt{font-size:13px;color:var(--txt2);background:var(--bg2);border-radius:var(--r-sm);padding:11px 13px;border:1px solid var(--line)}
.anchortxt b{color:var(--acc);font-weight:500}
.ed-dim textarea{width:100%;margin-top:11px;font-family:inherit;font-size:13.5px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surf);color:var(--txt);resize:vertical;min-height:42px;transition:.18s}
.ed-dim textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.ed-cat-h{font-family:'Geist Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;margin:22px 0 12px;color:var(--acc)}
.scorepreview{position:sticky;top:18px;text-align:center;border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;background:var(--glass);backdrop-filter:blur(20px);box-shadow:var(--sh)}
.scorepreview .pn{font-size:62px;line-height:.9;font-weight:600;letter-spacing:-.04em}
.editgrid{display:grid;grid-template-columns:1fr 260px;gap:26px;align-items:start}
@media(max-width:860px){.editgrid{grid-template-columns:1fr}}
.rm-row{display:grid;grid-template-columns:1fr;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.rm-row input,.rm-row textarea{width:100%;font-family:inherit;font-size:13.5px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surf);color:var(--txt);transition:.18s}
.rm-row input:focus,.rm-row textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.rm-anchors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
@media(max-width:680px){.rm-anchors{grid-template-columns:1fr}}
.wgt-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}

const TIERS=[
  {key:'plat',name:'Platinum',min:90,col:'#3a7bd5',cls:'plat',dcls:'platd'},
  {key:'gld',name:'Gold',min:80,col:'#c79a3b',cls:'gld',dcls:'gldd'},
  {key:'slv',name:'Silver',min:70,col:'#8b8b8b',cls:'slv',dcls:'slvd'},
  {key:'brz',name:'Bronze',min:60,col:'#a8662d',cls:'brz',dcls:'brzd'},
  {key:'roast',name:'Needs Roasting',min:0,col:'#e8482b',cls:'roast',dcls:'roastd'},

function tierFor(score){return TIERS.find(t=>score>=t.min);}

function freshDB(){
  const cats=SEED_CATEGORIES.map((c,i)=>({id:i+1,...c}));
  const dims=SEED_DIMS.map((d,i)=>({id:i+1,category_key:d[0],name:d[1],description:d[2],sort:i+1}));
  const anchors={};
  dims.forEach(d=>{const a=SEED_ANCHORS[d.name];anchors[d.id]={anchor_1:a[0],anchor_5:a[1],anchor_10:a[2]};});
  const db={
    categories:cats, dimensions:dims,
    rubric_versions:[{id:1,created_at:Date.now(),notes:'Initial rubric v1'}],
    rubric_anchors:{1:anchors},
    weights_versions:[{id:1, weights:Object.fromEntries(cats.map(c=>[c.key,c.weight]))}],
    brands:[], applications:[], audits:[], audit_scores:{}, nextId:1

}

let DB=null;
let adminCredentials=null;

async function apiJSON(path,opts={}){
  const res=await fetch(path,{headers:{'content-type':'application/json',...(opts.headers||{})},...opts});
  const data=await res.json().catch(()=>({ok:false,errors:['Unexpected server response']}));
  if(!res.ok)throw data;
  return data;
}
function authHeader(){
  return adminCredentials?{'authorization':'Basic '+btoa(adminCredentials.user+':'+adminCredentials.pass)}:{};
}
async function load(){
  return apiJSON('/api/state');
}
async function save(d){
  if(d)DB=d;
  if(!adminCredentials)return;
  try{
    const res=await apiJSON('/api/admin/state',{method:'POST',headers:authHeader(),body:JSON.stringify({state:DB})});
    if(res.state)DB=res.state;
  }catch(e){
    toast((e.errors&&e.errors.join(' '))||'Could not save changes');
    throw e;
  }
}
async function resetDB(){DB=await load();toast('Reloaded server data');route();}

/* scoring */
function activeWeights(db,wvId){const wv=db.weights_versions.find(w=>w.id===wvId)||db.weights_versions[db.weights_versions.length-1];return wv.weights;}
function computeOverall(scoreArr,db,rubricVid,weightsVid){
  const weights=activeWeights(db,weightsVid);
  const totalW=Object.values(weights).reduce((a,b)=>a+b,0)||1;
  let final=0;
  db.categories.forEach(cat=>{
    const dims=db.dimensions.filter(d=>d.category_key===cat.key);
    let sum=0,n=0;
    dims.forEach(d=>{const s=scoreArr.find(x=>x.dim_id===d.id);if(s){sum+=s.score;n++;}});
    const avg=n?sum/n:0; // 1..10
    const catPct=(avg-0)/10; // 0..1 (treat 0 baseline)
    final += catPct * (weights[cat.key]/totalW) * 100;
  });
  return Math.round(final);
}
function catBreakdown(scoreArr,db){
  return db.categories.map(cat=>{
    const dims=db.dimensions.filter(d=>d.category_key===cat.key);
    let sum=0,n=0;const rows=[];
    dims.forEach(d=>{const s=scoreArr.find(x=>x.dim_id===d.id);const v=s?s.score:0;sum+=v;n++;rows.push({dim:d,score:v,note:s?s.note:''});});
    return {cat,avg:n?(sum/n):0,rows};
  });
}

/* =========================================================
   ROUTER
   ========================================================= */
let route_state={page:'home',param:null};
function go(page,param){route_state={page,param:param||null};location.hash=page+(param?('/'+param):'');route();}
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');const[p,id]=h.split('/');if((p||'home')!==route_state.page||id!==route_state.param){route_state={page:p||'home',param:id||null};route();}});
function route(){
  const{page,param}=route_state;
  const isAdmin=page==='admin';
  document.getElementById('publicApp').classList.toggle('hidden',isAdmin);
  document.getElementById('adminApp').classList.toggle('hidden',!isAdmin);
  if(isAdmin){renderAdmin();return;}
  const v=document.getElementById('view');
  window.scrollTo(0,0);
  if(page==='home')v.innerHTML=viewHome();
  else if(page==='leaderboard')v.innerHTML=viewLeaderboard();
  else if(page==='methodology')v.innerHTML=viewMethodology();
  else if(page==='apply')v.innerHTML=viewApply();
  else if(page==='audit')v.innerHTML=viewAudit(parseInt(param));
  else if(page==='reaudit')v.innerHTML=viewReaudit(parseInt(param));
  else v.innerHTML=viewHome();
  if(page==='leaderboard')bindLeaderboard();
}

/* =========================================================
   PUBLIC VIEWS
   ========================================================= */
function publishedAudits(){return DB.audits.filter(a=>a.status==='published');}
function latestAuditByBrand(){
  const map={};
  publishedAudits().forEach(a=>{if(!map[a.brand_id]||a.published_at>map[a.brand_id].published_at)map[a.brand_id]=a;});
  return Object.values(map);
}
function brand(id){return DB.brands.find(b=>b.id===id);}

function viewHome(){
  const audits=latestAuditByBrand().sort((a,b)=>b.overall_score-a.overall_score);
  const top=audits.slice(0,3);
  const queue=DB.applications.filter(a=>a.status==='pending'||a.status==='in_progress').length;
  return `
  <section class="hero"><div class="wrap">
    <span class="kicker">Independent · FB &amp; IG · since 2026</span>
    <h1>Your feed thinks it\u2019s good. <em>We decide.</em></h1>
    <p class="lede">The Accreditation is a third-party audit of brand presence on Facebook &amp; Instagram \u2014 scored across 16 dimensions by real auditors, against published rubrics. Earn a tier. Wear the badge. Or get roasted.</p>
    <div class="herorow">
      <a class="btn acc" onclick="go('apply')"><i>\u25B8</i> Apply for an audit</a>
      <a class="btn" onclick="go('leaderboard')">See the leaderboard</a>
    </div>
    <div class="statline">
      <div class="s"><b>${audits.length}</b><span>Brands accredited</span></div>
      <div class="s"><b>16</b><span>Dimensions scored</span></div>
      <div class="s"><b>${queue}</b><span>In the queue</span></div>
    </div>
  </div></section>

  <section><div class="wrap">
    <div class="sec-h">The tiers</div>
    <h2 class="big" style="margin-bottom:24px">Five outcomes. No participation trophies.</h2>
    <div class="tiers">
      ${TIERS.map(t=>`<div class="tier"><div class="dot ${t.dcls}">${t.name[0]}</div><h4>${t.name}</h4><p>${t.key==='roast'?'Below 60':t.min+(t.key==='plat'?'+':'\u2013'+(TIERS[TIERS.indexOf(t)-1]?TIERS[TIERS.indexOf(t)-1].min-1:99))}</p></div>`).join('')}
    </div>
  </div></section>

  <section style="padding-top:0"><div class="wrap">
    <div class="sec-h">Top of the board</div>
    <h2 class="big" style="margin-bottom:24px">Currently leading</h2>
    <table class="lb"><thead><tr><th>#</th><th>Brand</th><th>Platform</th><th>Tier</th><th>Score</th></tr></thead><tbody>
    ${top.map((a,i)=>{const b=brand(a.brand_id);const t=tierFor(a.overall_score);return `<tr onclick="go('audit',${a.id})"><td class="rank">${i+1}</td><td><b>${esc(b.name)}</b><div class="qmeta">${esc(b.niche)}</div></td><td><span class="pf">${b.platform.toUpperCase()}</span></td><td><span class="tierbadge ${t.cls}"><span class="tdot ${t.dcls}"></span>${t.name}</span></td><td class="scorecell">${a.overall_score}</td></tr>`;}).join('')}
    </tbody></table>
    <div style="margin-top:18px"><a class="btn sm" onclick="go('leaderboard')">Full leaderboard \u2192</a></div>
  </div></section>

  <section style="padding-top:0"><div class="wrap">
    <div class="sec-h">How it works</div>
    <h2 class="big" style="margin-bottom:24px">Four categories, sixteen dimensions</h2>
    <div class="catgrid">${DB.categories.map(c=>catCardHTML(c)).join('')}</div>
    <div style="margin-top:20px"><a class="btn sm" onclick="go('methodology')">Read the full methodology \u2192</a></div>
  </div></section>`;
}
function catCardHTML(c){
  const dims=DB.dimensions.filter(d=>d.category_key===c.key);
  const w=activeWeights(DB,DB.weights_versions[DB.weights_versions.length-1].id);
  return `<div class="catcard"><div class="ch"><h3>${esc(c.name)}</h3><span class="wpill">${w[c.key]}% weight</span></div>
    <ul>${dims.map(d=>`<li><i>\u2192</i>${esc(d.name)}</li>`).join('')}</ul></div>`;
}

function viewLeaderboard(){
  return `<section><div class="wrap">
    <div class="sec-h">The board</div>
    <h2 class="big" style="margin-bottom:20px">Leaderboard</h2>
    <div class="lbcontrols">
      <input id="lbsearch" placeholder="Search brand\u2026" />
      <select id="lbtier"><option value="">All tiers</option>${TIERS.map(t=>`<option value="${t.key}">${t.name}</option>`).join('')}</select>
      <select id="lbplat"><option value="">All platforms</option><option value="ig">Instagram</option><option value="fb">Facebook</option></select>
    </div>
    <table class="lb"><thead><tr>
      <th data-s="rank">#</th><th data-s="name">Brand</th><th data-s="platform">Platform</th>
      <th data-s="tier">Tier</th><th data-s="score">Score</th><th data-s="date">Last audit</th>
    </tr></thead><tbody id="lbbody"></tbody></table>
    <p class="qmeta" style="margin-top:14px">Click any row to read the full audit. Click a column header to sort.</p>
  </div></section>`;
}
let lbSort={key:'score',dir:-1};
function bindLeaderboard(){
  document.getElementById('lbsearch').addEventListener('input',renderLB);
  document.getElementById('lbtier').addEventListener('change',renderLB);
  document.getElementById('lbplat').addEventListener('change',renderLB);
  document.querySelectorAll('table.lb th[data-s]').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.s;if(lbSort.key===k)lbSort.dir*=-1;else{lbSort={key:k,dir:k==='name'?1:-1};}renderLB();}));
  renderLB();
}
function renderLB(){
  const q=(document.getElementById('lbsearch').value||'').toLowerCase();
  const ft=document.getElementById('lbtier').value, fp=document.getElementById('lbplat').value;
  let rows=latestAuditByBrand().map(a=>{const b=brand(a.brand_id);const t=tierFor(a.overall_score);const cnt=publishedAudits().filter(x=>x.brand_id===a.brand_id).length;return{a,b,t,cnt};});
  rows=rows.filter(r=>(!q||r.b.name.toLowerCase().includes(q))&&(!ft||r.t.key===ft)&&(!fp||r.b.platform===fp));
  rows.sort((x,y)=>{let v;switch(lbSort.key){case'name':v=x.b.name.localeCompare(y.b.name);break;case'platform':v=x.b.platform.localeCompare(y.b.platform);break;case'tier':v=x.a.overall_score-y.a.overall_score;break;case'date':v=x.a.published_at-y.a.published_at;break;default:v=x.a.overall_score-y.a.overall_score;}return v*lbSort.dir;});
  const body=document.getElementById('lbbody');
  if(!rows.length){body.innerHTML=`<tr><td colspan="6" class="empty"><i class="ti ti-mood-empty"></i>No brands match.</td></tr>`;return;}
  body.innerHTML=rows.map((r,i)=>`<tr onclick="go('audit',${r.a.id})">
    <td class="rank">${i+1}</td>
    <td><b>${esc(r.b.name)}</b><div class="qmeta">${esc(r.b.niche)} · ${r.cnt} audit${r.cnt>1?'s':''}</div></td>
    <td><span class="pf">${r.b.platform.toUpperCase()}</span></td>
    <td><span class="tierbadge ${r.t.cls}"><span class="tdot ${r.t.dcls}"></span>${r.t.name}</span></td>
    <td class="scorecell">${r.a.overall_score}</td>
    <td class="qmeta">${fmtDate(r.a.published_at)}</td>
  </tr>`).join('');
}

function viewAudit(id){
  const a=DB.audits.find(x=>x.id===id&&x.status==='published');
  if(!a)return notFound('That audit isn\u2019t published (or doesn\u2019t exist).');
  const b=brand(a.brand_id);const t=tierFor(a.overall_score);
  const scores=DB.audit_scores[a.id]||[];
  const breakdown=catBreakdown(scores.map(s=>({dim_id:s.dim_id,score:s.score,note:s.note})),DB);
  const badge=location.origin+location.pathname+'#audit/'+a.id;
  const embed=`<a href="${badge}">\n  <img src="badge-${a.id}.svg" alt="The Accreditation \u2014 ${esc(b.name)}: ${t.name} ${a.overall_score}/100" width="220">\n</a>`;
  return `<section><div class="wrap">
    <a class="btn ghost sm" onclick="go('leaderboard')" style="margin-bottom:20px">\u2190 Back to leaderboard</a>
    <div class="auditgrid">
      <div>
        <div class="scorebox">
          <div class="top ${t.dcls}">
            <div class="bignum">${a.overall_score}</div>
            <div class="of">/ 100 \u00b7 ${t.name.toUpperCase()}</div>
          </div>
          <div class="bod">

async function submitApply(){
  const n=val('ap_name'),plat=val('ap_plat'),url=val('ap_url'),email=val('ap_email'),niche=val('ap_niche'),why=val('ap_why'),hp=val('ap_hp');
  const note=document.getElementById('applyNotice');
  // anti-abuse: honeypot
  if(hp){note.innerHTML='';return;}
  const errs=[];
  if(n.length<2||n.length>80)errs.push('Brand name looks off.');
  if(!/^https?:\/\/(www\.)?(facebook|instagram)\.com\//i.test(url))errs.push('Profile URL must be a facebook.com or instagram.com link.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))errs.push('Enter a valid email.');
  if(niche.length<2)errs.push('Tell us your niche.');
  if(why.length<10)errs.push('Give us a sentence on why you want it.');
  if(errs.length){note.innerHTML=`<div class="notice err"><i class="ti ti-alert-triangle"></i> ${errs.join(' ')}</div>`;return;}
  try{
    const res=await apiJSON('/api/applications',{method:'POST',body:JSON.stringify({brandName:n,platform:plat,url,email,niche,why,honeypot:hp})});
    if(res.state)DB=res.state;
    document.getElementById('applyForm').innerHTML=`<div class="notice ok"><i class="ti ti-check"></i> Application received for <b>${esc(n)}</b>. It\u2019s now in the audit queue. Watch your inbox at ${esc(email)}.</div><a class="btn sm" onclick="go('leaderboard')">See the leaderboard \u2192</a>`;
  }catch(e){
    note.innerHTML=`<div class="notice err"><i class="ti ti-alert-triangle"></i> ${((e.errors)||['Could not submit application.']).join(' ')}</div>`;
  }
}

function viewReaudit(id){

async function submitReaudit(id){
  const a=DB.audits.find(x=>x.id===id);const b=brand(a.brand_id);
  const email=val('ra_email'),note=val('ra_note');const out=document.getElementById('raNotice');
  const errs=[];
  if((Date.now()-a.published_at)/86400000<30)errs.push('Too soon \u2014 30-day cooldown.');
  if(email.trim().toLowerCase()!==b.contact_email.toLowerCase())errs.push('Email must match the one on the original audit.');
  if(note.trim().length<15)errs.push('Tell us what changed (a real sentence).');
  if(errs.length){out.innerHTML=`<div class="notice err"><i class="ti ti-alert-triangle"></i> ${errs.join(' ')}</div>`;return;}
  try{
    const res=await apiJSON('/api/reaudits',{method:'POST',body:JSON.stringify({auditId:id,email,changesNote:note})});
    if(res.state)DB=res.state;
    document.getElementById('raForm').innerHTML=`<div class="notice ok"><i class="ti ti-check"></i> Re-audit requested for <b>${esc(b.name)}</b>. It\u2019s back in the queue.</div>`;
  }catch(e){
    out.innerHTML=`<div class="notice err"><i class="ti ti-alert-triangle"></i> ${((e.errors)||['Could not request re-audit.']).join(' ')}</div>`;
  }
}

function anchorFor(a,score){
  let lab,txt;
  if(score<=3){lab='1';txt=a.anchor_1;} else if(score<=7){lab='5';txt=a.anchor_5;} else {lab='10';txt=a.anchor_10;}
  return `<b>Anchor ${lab}:</b> ${esc(txt)}`;
}

function setNote(id,v){adminState.scores[id].note=v;}
function updatePreview(){
  const arr=Object.entries(adminState.scores).map(([id,s])=>({dim_id:parseInt(id),score:s.score}));
  const overall=computeOverall(arr,DB,adminState.editing.rubric,adminState.editing.weights);
  const t=tierFor(overall);
  document.getElementById('pv_num').textContent=overall;
  document.getElementById('pv_num').style.color=t.col;
  document.getElementById('pv_tier').innerHTML=`<span class="tierbadge ${t.cls}"><span class="tdot ${t.dcls}"></span>${t.name}</span>`;
  const bd=catBreakdown(arr.map(x=>({dim_id:x.dim_id,score:x.score})),DB);
  document.getElementById('pv_cats').innerHTML=bd.map(b=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed #c9c4b6"><span>${esc(b.cat.name)}</span><span class="mono" style="font-weight:700">${b.avg.toFixed(1)}</span></div>`).join('');
}
function cancelEdit(){adminState.editing=null;adminState.page='queue';renderAdmin();}
function buildAudit(status){
  const e=adminState.editing;const arr=Object.entries(adminState.scores).map(([id,s])=>({dim_id:parseInt(id),score:s.score,note:s.note}));
  const overall=computeOverall(arr.map(x=>({dim_id:x.dim_id,score:x.score})),DB,e.rubric,e.weights);
  let aud=e.auditId?DB.audits.find(a=>a.id===e.auditId):null;
  if(!aud){aud={id:DB.nextId++,brand_id:e.brandId,auditor:adminState.user,rubric_version_id:e.rubric,weights_version_id:e.weights,created_at:Date.now()};DB.audits.push(aud);e.auditId=aud.id;}
  aud.status=status;aud.overall_score=overall;aud.tier=tierFor(overall).key;aud.summary=e.summary||'Audited across all 16 dimensions.';
  if(status==='published')aud.published_at=Date.now();
  DB.audit_scores[aud.id]=arr;
  if(status==='published'&&e.appId){const ap=DB.applications.find(a=>a.id===e.appId);if(ap)ap.status='completed';}
  return aud;
}
async function saveDraft(){buildAudit('draft');await save();toast('Draft saved');}
async function publishAudit(){const aud=buildAudit('published');await save();adminState.editing=null;adminState.page='queue';toast('Published \u2014 public audit live');renderAdmin();setTimeout(()=>go('audit',aud.id),400);}

/* RUBRIC MANAGER */
function adminRubric(){
  if(!adminState.rubricDraft){
    const cur=DB.rubric_versions[DB.rubric_versions.length-1].id;
    adminState.rubricDraft=JSON.parse(JSON.stringify({dims:DB.dimensions,anchors:DB.rubric_anchors[cur]}));
    adminState.rubricBase=cur;
  }
  const d=adminState.rubricDraft;
  return `<div class="ah"><h2>Rubric manager</h2><span class="qmeta">Editing from v${adminState.rubricBase} \u00b7 ${DB.rubric_versions.length} version(s)</span></div>
  <div class="notice"><i class="ti ti-info-circle"></i> Saving creates a <b>new rubric version</b>. Existing audits keep the version they were scored on.</div>
  ${DB.categories.map(c=>{
    const dims=d.dims.filter(x=>x.category_key===c.key);
    return `<h3 class="ed-cat-h">${esc(c.name)}</h3><div class="card">${dims.map(dim=>{const a=d.anchors[dim.id];return `
      <div class="rm-row">
        <input value="${esc(dim.name)}" onchange="rmEdit(${dim.id},'name',this.value)" style="font-weight:700">
        <input value="${esc(dim.description)}" onchange="rmEdit(${dim.id},'description',this.value)" placeholder="description">
        <div class="rm-anchors">
          <textarea onchange="rmAnchor(${dim.id},'anchor_1',this.value)" placeholder="Anchor 1">${esc(a.anchor_1)}</textarea>
          <textarea onchange="rmAnchor(${dim.id},'anchor_5',this.value)" placeholder="Anchor 5">${esc(a.anchor_5)}</textarea>
          <textarea onchange="rmAnchor(${dim.id},'anchor_10',this.value)" placeholder="Anchor 10">${esc(a.anchor_10)}</textarea>
        </div>
      </div>`;}).join('')}</div>`;
  }).join('')}
  <button class="btn acc" onclick="saveRubric()"><i class="ti ti-device-floppy"></i> Save as new version</button>
  <button class="btn ghost" onclick="adminState.rubricDraft=null;renderAdmin()">Discard changes</button>`;
}
function rmEdit(id,f,v){const dim=adminState.rubricDraft.dims.find(x=>x.id===id);dim[f]=v;}
function rmAnchor(id,f,v){adminState.rubricDraft.anchors[id][f]=v;}
async function saveRubric(){
  const newId=DB.rubric_versions.length+1;
  DB.rubric_versions.push({id:newId,created_at:Date.now(),notes:'Edited from v'+adminState.rubricBase});
  DB.dimensions=adminState.rubricDraft.dims;
  DB.rubric_anchors[newId]=JSON.parse(JSON.stringify(adminState.rubricDraft.anchors));
  adminState.rubricDraft=null;await save();toast('Rubric v'+newId+' saved');renderAdmin();
}

/* WEIGHTS MANAGER */
function adminWeights(){
  const w=activeWeights(DB,DB.weights_versions[DB.weights_versions.length-1].id);
  return `<div class="ah"><h2>Weights</h2><span class="qmeta">Affects new audits only</span></div>
  <div class="card" style="max-width:480px">
    ${DB.categories.map(c=>`<div class="wgt-row"><span class="wn">${esc(c.name)}</span><input type="number" min="0" max="100" id="wt_${c.key}" value="${w[c.key]}" oninput="wtotal()"></div>`).join('')}
    <div class="wtotal" id="wtot">Total: 100%</div>
    <button class="btn acc" style="margin-top:14px" onclick="saveWeights()"><i class="ti ti-device-floppy"></i> Save weights</button>
  </div>`;
}
function wtotal(){const t=DB.categories.reduce((s,c)=>s+(parseInt(val('wt_'+c.key))||0),0);const el=document.getElementById('wtot');el.textContent='Total: '+t+'%'+(t!==100?' \u2014 should be 100':'');el.style.color=t===100?'var(--acc2)':'var(--acc)';}
async function saveWeights(){
  const w={};let t=0;DB.categories.forEach(c=>{w[c.key]=parseInt(val('wt_'+c.key))||0;t+=w[c.key];});
  if(t!==100){toast('Weights must total 100');return;}
  const id=DB.weights_versions.length+1;DB.weights_versions.push({id,weights:w});
  DB.categories.forEach(c=>c.weight=w[c.key]);await save();toast('Weights v'+id+' saved');renderAdmin();
}

/* USERS */
function adminUsers(){
  const users=DB.users||(DB.users=[{name:'Roaster',role:'admin',email:'roaster@accreditation.io'}]);
  return `<div class="ah"><h2>Users</h2></div>
  <div class="card">${users.map((u,i)=>`<div class="qrow"><div><b>${esc(u.name)}</b> <span class="stag s-completed">${u.role}</span><div class="qmeta">${esc(u.email)}</div></div>${u.role!=='admin'?`<button class="btn sm ghost" onclick="rmUser(${i})">Remove</button>`:'<span class="qmeta">owner</span>'}</div>`).join('')}</div>
  <h3 class="ed-cat-h">Invite a co-auditor</h3>
  <div class="card" style="max-width:480px">
    <div class="field"><label>Name</label><input id="us_name" placeholder="Jane Auditor"></div>
    <div class="field"><label>Email</label><input id="us_email" placeholder="jane@\u2026"></div>
    <button class="btn acc" onclick="addUser()"><i class="ti ti-user-plus"></i> Send invite (auditor role)</button>
  </div>`;
}
async function addUser(){const n=val('us_name'),e=val('us_email');if(n.length<2||!/.+@.+\..+/.test(e)){toast('Enter a name and valid email');return;}DB.users.push({name:n,role:'auditor',email:e});await save();toast('Invited '+n);renderAdmin();}
async function rmUser(i){DB.users.splice(i,1);await save();renderAdmin();}

/* =========================================================
   UTIL
   ========================================================= */
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmtDate(ts){return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function handleFrom(url){try{const p=new URL(url).pathname.replace(/\//g,'');return (url.includes('instagram')?'@':'')+(p||'profile');}catch(e){return 'profile';}}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}

/* reset hook via keyboard: press R+E+S not needed; expose button in footer area through console */
window.resetDB=resetDB;

(async function(){
  try{
    DB=await load();
    const h=location.hash.replace('#','');const[p,id]=h.split('/');
    route_state={page:p||'home',param:id||null};route();
  }catch(e){
    document.body.innerHTML='<div style="font-family:system-ui,sans-serif;padding:32px;color:#f2f3f5;background:#0a0b0d;min-height:100vh">Could not load Accreditation data. Please refresh or check the server.</div>';
  }
})();
</script>
