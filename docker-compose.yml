services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: accreditation
    volumes:
      - accreditation_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accreditation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  accreditation_pg:
